name: ALBW cross-check

on:
  workflow_dispatch:
    inputs:
      export_key:
        description: "Export cache key"
        required: true
        default: "albw-export-38100867527"

jobs:
  xcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Restore export
        uses: actions/cache/restore@v4
        with:
          path: export
          key: ${{ inputs.export_key }}
          fail-on-cache-miss: true

      - name: Download dump
        env:
          ALBW_URL: "https://drive.usercontent.google.com/download?id=1ypm1CGmbkAgkRBdLHvxhjJo-a3BYvTE2&export=download&confirm=t"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -A "Mozilla/5.0" -o dump.bin "$ALBW_URL"
          ls -lh dump.bin

      - name: Pull out .code
        run: |
          python3 - <<'EOF'
          import struct
          f = open('dump.bin', 'rb')
          def rd(o, n):
              f.seek(o)
              return f.read(n)
          def u32(o):
              return struct.unpack('<I', rd(o, 4))[0]
          base = u32(0x120) * 0x200
          assert rd(base + 0x100, 4) == b'NCCH'
          exefs = base + u32(base + 0x1A0) * 0x200
          hdr = rd(exefs, 0xA0)
          code_off = code_size = None
          for i in range(10):
              e = hdr[i * 16:(i + 1) * 16]
              if e[:8].rstrip(b'\0') == b'.code':
                  code_off, code_size = struct.unpack('<II', e[8:])
          assert code_size == 0x628000, hex(code_size)
          code = rd(exefs + 0x200 + code_off, code_size)
          assert struct.unpack_from('<I', code, 0)[0] == 0xEB000007
          open('code.bin', 'wb').write(code)
          print('wrote code.bin', len(code))
          EOF
          rm dump.bin

      - name: Install Capstone
        run: pip install capstone

      - name: Write cross-check script
        run: |
          cat > xcheck.py <<'PY'
          import re, bisect, collections, os
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_THUMB

          TEXT_LO, TEXT_HI = 0x100000, 0x69211c
          code = open('code.bin', 'rb').read()
          assert len(code) == 0x628000

          BASE = set("""adc add and bic cmn cmp eor mov mvn orr rsb rsc sbc sub teq tst
          mul mla mls umull umlal smull smlal umaal
          ldr ldrb ldrh ldrsb ldrsh ldrd ldrt ldrbt ldm ldmia ldmib ldmda ldmdb
          str strb strh strd strt strbt stm stmia stmib stmda stmdb
          b bl bx blx bxj clz swp swpb svc swi push pop nop
          lsl lsr asr ror rrx uxtb uxth sxtb sxth uxtab uxtah sxtab sxtah
          bfi bfc ubfx sbfx rev rev16 revsh pld pli
          ldrex strex ldrexb strexb ldrexh strexh ldrexd strexd clrex
          mcr mcr2 mrc mrc2 mrs msr cdp ldc stc bkpt udf sel usat ssat pkhbt pkhtb
          smla smlabb smlabt smlatb smlatt smulbb smulbt smultb smultt smlad smuad smusd smmul smmla
          qadd qsub qdadd qdsub dmb dsb isb wfe wfi yield sev cps it
          vldr vstr vmov vmul vmla vmls vnmla vnmls vnmul vadd vsub vdiv vsqrt vabs vneg
          vcmp vcmpe vcvt vcvtr vcvtb vcvtt vmrs vmsr vpush vpop vldmia vldmdb vstmia vstmdb
          vfma vfms vfnma vfnms""".split())
          CONDS = ['eq', 'ne', 'hs', 'cs', 'lo', 'cc', 'mi', 'pl', 'vs', 'vc', 'hi', 'ls', 'ge', 'lt', 'gt', 'le']
          BRANCH = {'b', 'bl', 'blx', 'bx', 'bxj'}
          IMM = re.compile(r'^#?(0x[0-9a-f]+|\d+)$')
          SHIFT = re.compile(r'\b(lsl|lsr|asr|ror|rrx)\b')
          LOADS = {'ldr', 'ldrb', 'ldrh', 'ldrsb', 'ldrsh', 'ldrd'}

          def split_cc(m):
              if m in BASE:
                  return m, 'al'
              if len(m) > 2 and m[-2:] in CONDS:
                  b = m[:-2]
                  if b in BASE:
                      return b, m[-2:]
                  if b.endswith('s') and b[:-1] in BASE:
                      return b, m[-2:]
              if m.endswith('s') and m[:-1] in BASE:
                  return m, 'al'
              return m, '?'

          # ---- load Ghidra export ----
          funcs = []
          for line in open('export/functions.tsv'):
              if line.startswith('#') or not line.strip():
                  continue
              entry, mode, size, ranges, name = line.rstrip('\n').split('\t')
              rs = []
              for part in ranges.split(';'):
                  lo, hi = part.split('-')
                  rs.append((int(lo, 16), int(hi, 16)))
              funcs.append((int(entry, 16), mode, rs, name))

          def load_ranges(path):
              out = []
              for line in open(path):
                  if line.startswith('#') or not line.strip():
                      continue
                  a, n = line.split()[:2]
                  out.append((int(a, 16), int(n)))
              out.sort()
              return out

          undef = load_ranges('export/undefined_ranges.tsv')
          data = load_ranges('export/data_ranges.tsv')
          undef_starts = [s for s, n in undef]
          data_starts = [s for s, n in data]

          def in_ranges(rs, starts_list, x):
              i = bisect.bisect_right(starts_list, x) - 1
              if i < 0:
                  return False
              s, n = rs[i]
              return s <= x < s + n

          # ---- decode ----
          md_a = Cs(CS_ARCH_ARM, CS_MODE_ARM)
          md_t = Cs(CS_ARCH_ARM, CS_MODE_THUMB)
          starts = set()
          base_counts = collections.Counter()
          unknown = collections.Counter()
          feat = collections.Counter()
          branches = []
          bad = []
          bad_funcs = set()
          range_bytes = 0
          decoded_bytes = 0
          n_ins = 0
          n_thumb = 0

          for entry, mode, rs, name in funcs:
              thumb = (mode == 'T')
              md = md_t if thumb else md_a
              step = 2 if thumb else 4
              for lo, hi in rs:
                  if lo < TEXT_LO or hi >= TEXT_HI:
                      continue
                  buf = code[lo - TEXT_LO: hi + 1 - TEXT_LO]
                  range_bytes += len(buf)
                  pos = 0
                  while pos < len(buf):
                      for ins in md.disasm(buf[pos:], lo + pos):
                          pos += ins.size
                          n_ins += 1
                          decoded_bytes += ins.size
                          starts.add(ins.address)
                          if thumb:
                              n_thumb += 1
                          mn = ins.mnemonic
                          op = ins.op_str
                          base, cc = split_cc(mn.split('.')[0])
                          base_counts[base] += 1
                          if cc == '?':
                              unknown[mn] += 1
                          if base in ('b', 'bl', 'blx'):
                              mm = IMM.match(op.strip())
                              if mm:
                                  branches.append((ins.address, int(mm.group(1), 0), base))
                              elif base == 'blx':
                                  feat['blx reg (indirect call)'] += 1
                          elif base in ('bx', 'bxj'):
                              if op.strip() == 'lr':
                                  feat['bx lr (return)'] += 1
                              else:
                                  feat['bx reg (indirect jump)'] += 1
                          if cc not in ('al', '?') and base not in BRANCH:
                              feat['conditionally executed (non-branch)'] += 1
                          if base in LOADS and '[pc' in op:
                              feat['pc-relative load (literal pool)'] += 1
                          elif op.startswith('pc,') and base not in ('cmp', 'cmn', 'tst', 'teq'):
                              feat['writes pc via ' + base] += 1
                          if base in ('pop', 'ldm', 'ldmia', 'ldmib', 'ldmda', 'ldmdb') and re.search(r'\bpc\b', op):
                              feat['load-multiple/pop into pc'] += 1
                          if SHIFT.search(op):
                              feat['shifted operand'] += 1
                          if base.startswith('v'):
                              feat['VFP instruction'] += 1
                      if pos < len(buf):
                          bad.append((lo + pos, name))
                          bad_funcs.add(name)
                          pos += step

          # ---- branch targets ----
          missing = collections.Counter()
          outside = 0
          for src, tgt, b in branches:
              if not (TEXT_LO <= tgt < TEXT_HI):
                  outside += 1
                  continue
              if tgt not in starts:
                  missing[tgt] += 1
          cat = collections.Counter()
          for t in missing:
              if in_ranges(undef, undef_starts, t):
                  cat['in undefined bytes (missed code?)'] += 1
              elif in_ranges(data, data_starts, t):
                  cat['in defined data'] += 1
              else:
                  cat['inside or between decoded code'] += 1

          # ---- jump tables ----
          jt_tables = 0
          jt_overlap = []
          jt_bad_targets = 0
          jt_ok = 0
          for line in open('export/jumptables.tsv'):
              if line.startswith('#') or not line.strip():
                  continue
              f = line.rstrip('\n').split('\t')
              site, tbl, bound, n = f[0], f[1], int(f[2]), int(f[3])
              if tbl == 'ADDPC' or n == 0:
                  continue
              tg = [int(x, 16) for x in f[4].split(',')]
              t0 = int(tbl, 16)
              end = t0 + 4 * n
              low = min(t & ~1 for t in tg)
              jt_tables += 1
              nb = sum(1 for t in tg if (t & ~1) not in starts)
              jt_bad_targets += nb
              if end > low:
                  jt_overlap.append((site, bound, n, (low - t0) // 4))
              elif nb == 0:
                  jt_ok += 1

          # ---- write reports ----
          os.makedirs('reports', exist_ok=True)
          out = []
          def p(s=''):
              out.append(s)

          p('functions in export: %d' % len(funcs))
          p('decoded instructions: %d (thumb %d)' % (n_ins, n_thumb))
          p('range bytes %d, decoded bytes %d, undecodable spots %d in %d functions'
            % (range_bytes, decoded_bytes, len(bad), len(bad_funcs)))
          p('--- top 60 base operations ---')
          for k, v in base_counts.most_common(60):
              p('  %s: %d' % (k, v))
          p('distinct base operations: %d' % len(base_counts))
          p('--- mnemonics I could not split into op+condition (top 25) ---')
          for k, v in unknown.most_common(25):
              p('  %s: %d' % (k, v))
          p('--- features the translator must handle ---')
          for k, v in sorted(feat.items(), key=lambda kv: -kv[1]):
              p('  %s: %d' % (k, v))
          p('--- direct branches (b/bl/blx immediate) ---')
          p('total: %d, outside .text: %d' % (len(branches), outside))
          p('targets that are not a decoded instruction start: %d distinct, %d branches'
            % (len(missing), sum(missing.values())))
          for k, v in cat.items():
              p('  %s: %d targets' % (k, v))
          p('top 20 missing targets by number of branches:')
          for t, c in missing.most_common(20):
              p('  0x%08x: %d' % (t, c))
          p('--- jump tables ---')
          p('tables: %d, all targets valid and no overlap: %d' % (jt_tables, jt_ok))
          p('tables overlapping their own first target: %d' % len(jt_overlap))
          for site, bound, n, sug in jt_overlap[:15]:
              p('  site 0x%08x bound=%d entries=%d suggested max=%d' % (int(site, 16), bound, n, sug))
          p('targets that are not a decoded instruction start: %d' % jt_bad_targets)

          open('reports/xcheck_summary.txt', 'w').write('\n'.join(out) + '\n')
          with open('reports/bad_decode.txt', 'w') as w:
              for a, nm in bad:
                  w.write('0x%08x %s\n' % (a, nm))
          with open('reports/missing_branch_targets.txt', 'w') as w:
              for t, c in sorted(missing.items()):
                  w.write('0x%08x %d\n' % (t, c))
          with open('reports/instr_forms.txt', 'w') as w:
              for k, v in base_counts.most_common():
                  w.write('%s %d\n' % (k, v))
          print('done')
          PY

      - name: Run cross-check
        run: python3 xcheck.py

      - name: Show reports
        run: |
          echo "=== xcheck_summary ==="
          cat reports/xcheck_summary.txt
          echo "=== first 20 undecodable spots ==="
          head -20 reports/bad_decode.txt

      - name: Upload reports (addresses and counts only)
        uses: actions/upload-artifact@v4
        with:
          name: albw-xcheck
          path: reports/*.txt
          retention-days: 7

