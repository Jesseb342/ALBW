name: Extract ALBW

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download dump
        env:
          ALBW_URL: "https://drive.usercontent.google.com/download?id=1ypm1CGmbkAgkRBdLHvxhjJo-a3BYvTE2&export=download&confirm=t"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -A "Mozilla/5.0" -o dump.bin "$ALBW_URL"
          ls -lh dump.bin

      - name: Slice game partition and mark decrypted
        run: |
          python3 - <<'EOF'
          OFF = 0x4000
          SIZE = 0x2a659000
          with open('dump.bin', 'rb') as src, open('ncch.bin', 'wb') as dst:
              src.seek(OFF)
              remaining = SIZE
              while remaining:
                  chunk = src.read(min(remaining, 16 * 1024 * 1024))
                  if not chunk:
                      break
                  dst.write(chunk)
                  remaining -= len(chunk)
          with open('ncch.bin', 'r+b') as f:
              f.seek(0x18F)
              b = f.read(1)[0]
              f.seek(0x18F)
              f.write(bytes([b | 0x04]))
          EOF
          rm dump.bin
          ls -lh ncch.bin

      - name: Build ctrtool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git
          cd Project_CTR/ctrtool
          make deps || true
          make -j4
          CT="$(find . -name ctrtool -type f -perm -u+x | head -n 1)"
          echo "ctrtool at: $CT"
          cp "$CT" "$GITHUB_WORKSPACE/ctrtool"

      - name: Extract ExeFS and RomFS
        run: |
          set -euo pipefail
          mkdir -p out
          ./ctrtool \
            --exheader=out/exheader.bin \
            --exefsdir=out/exefs \
            --romfsdir=out/romfs \
            --decompresscode \
            ncch.bin

      - name: List contents (names and sizes only)
        run: |
          echo "=== ExeFS ==="
          ls -la out/exefs
          echo "=== top of RomFS ==="
          ls -la out/romfs | head -40
          echo "=== RomFS file count ==="
          find out/romfs -type f | wc -l
          echo "=== CRO modules (first 60) ==="
          find out/romfs -type f -iname '*.cro' | head -60
          echo "=== sizes ==="
          du -sh out/*

