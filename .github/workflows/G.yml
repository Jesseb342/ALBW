name: ALBW reachability

on:
  workflow_dispatch:
    inputs:
      export_key:
        description: "Export cache key"
        required: true
        default: "albw-export-38100867527"

jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Restore export
        uses: actions/cache/restore@v4
        with:
          path: export
          key: ${{ inputs.export_key }}
          fail-on-cache-miss: true

      - name: Download dump
        env:
          ALBW_URL: "https://drive.usercontent.google.com/download?id=1ypm1CGmbkAgkRBdLHvxhjJo-a3BYvTE2&export=download&confirm=t"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -A "Mozilla/5.0" -o dump.bin "$ALBW_URL"
          ls -lh dump.bin

      - name: Pull out .code
        run: |
          python3 - <<'EOF'
          import struct
          f = open('dump.bin', 'rb')
          def rd(o, n):
              f.seek(o)
              return f.read(n)
          def u32(o):
              return struct.unpack('<I', rd(o, 4))[0]
          base = u32(0x120) * 0x200
          assert rd(base + 0x100, 4) == b'NCCH'
          exefs = base + u32(base + 0x1A0) * 0x200
          hdr = rd(exefs, 0xA0)
          code_off = code_size = None
          for i in range(10):
              e = hdr[i * 16:(i + 1) * 16]
              if e[:8].rstrip(b'\0') == b'.code':
                  code_off, code_size = struct.unpack('<II', e[8:])
          assert code_size == 0x628000, hex(code_size)
          code = rd(exefs + 0x200 + code_off, code_size)
          assert struct.unpack_from('<I', code, 0)[0] == 0xEB000007
          open('code.bin', 'wb').write(code)
          print('wrote code.bin', len(code))
          EOF
          rm dump.bin

      - name: Install Capstone
        run: pip install capstone

      - name: Write reachability script
        run: |
          cat > reach.py <<'PY'
          import re, collections, os
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_THUMB

          TEXT_LO, TEXT_HI = 0x100000, 0x69211c
          SIZE = TEXT_HI - TEXT_LO
          code = open('code.bin', 'rb').read()
          assert len(code) == 0x628000

          BASE = set("""adc add and bic cmn cmp eor mov mvn orr rsb rsc sbc sub teq tst cpy adr
          mul mla mls umull umlal smull smlal umaal
          ldr ldrb ldrh ldrsb ldrsh ldrd ldrt ldrbt ldm ldmia ldmib ldmda ldmdb
          str strb strh strd strt strbt stm stmia stmib stmda stmdb
          b bl bx blx bxj clz swp swpb svc swi push pop nop
          lsl lsr asr ror rrx uxtb uxth sxtb sxth uxtab uxtah sxtab sxtah
          bfi bfc ubfx sbfx rev rev16 revsh pld pli tbb tbh cbz cbnz
          ldrex strex ldrexb strexb ldrexh strexh ldrexd strexd clrex
          mcr mcr2 mrc mrc2 mrs msr cdp ldc stc bkpt udf sel usat ssat pkhbt pkhtb
          smla smlabb smlabt smlatb smlatt smlad smuad smusd smmul smmla
          qadd qsub qdadd qdsub dmb dsb isb wfe wfi yield sev cps it
          vldr vstr vmov vmul vmla vmls vnmla vnmls vnmul vadd vsub vdiv vsqrt vabs vneg
          vcmp vcmpe vcvt vcvtr vcvtb vcvtt vmrs vmsr vpush vpop vldmia vldmdb vstmia vstmdb
          vfma vfms vfnma vfnms""".split())
          CONDS = ['eq', 'ne', 'hs', 'cs', 'lo', 'cc', 'mi', 'pl', 'vs', 'vc', 'hi', 'ls', 'ge', 'lt', 'gt', 'le']
          IMM = re.compile(r'#(0x[0-9a-fA-F]+|\d+)')
          PCW = {'ldr', 'mov', 'cpy', 'add', 'sub', 'orr', 'and', 'eor', 'bic', 'mvn', 'adc', 'sbc', 'rsb', 'rsc'}
          LDM = {'pop', 'ldm', 'ldmia', 'ldmib', 'ldmda', 'ldmdb'}

          def split_cc(m):
              if m in BASE:
                  return m, 'al'
              if len(m) > 2 and m[-2:] in CONDS:
                  b = m[:-2]
                  if b in BASE:
                      return b, m[-2:]
                  if b.endswith('s') and b[:-1] in BASE:
                      return b, m[-2:]
              if m.endswith('s') and m[:-1] in BASE:
                  return m, 'al'
              return m, '?'

          # ---------- load the Ghidra export ----------
          funcs = []
          for line in open('export/functions.tsv'):
              if line.startswith('#') or not line.strip():
                  continue
              entry, mode, size, ranges, name = line.rstrip('\n').split('\t')
              rs = []
              for part in ranges.split(';'):
                  lo, hi = part.split('-')
                  rs.append((int(lo, 16), int(hi, 16)))
              funcs.append((int(entry, 16), mode == 'T', rs, name))

          def mask_from(path):
              m = bytearray(SIZE)
              for line in open(path):
                  if line.startswith('#') or not line.strip():
                      continue
                  a, n = line.split()[:2]
                  lo = int(a, 16) - TEXT_LO
                  hi = min(lo + int(n), SIZE)
                  if 0 <= lo < SIZE:
                      m[lo:hi] = b'\x01' * (hi - lo)
              return m

          undef = mask_from('export/undefined_ranges.tsv')
          data = mask_from('export/data_ranges.tsv')
          func = bytearray(SIZE)
          for entry, th, rs, name in funcs:
              for lo, hi in rs:
                  a, b = lo - TEXT_LO, hi + 1 - TEXT_LO
                  if 0 <= a < SIZE:
                      func[a:min(b, SIZE)] = b'\x01' * (min(b, SIZE) - a)

          tables = []
          for line in open('export/jumptables.tsv'):
              if line.startswith('#') or not line.strip():
                  continue
              f = line.rstrip('\n').split('\t')
              if f[1] == 'ADDPC' or int(f[3]) == 0:
                  continue
              tg = [int(x, 16) for x in f[4].split(',')]
              tables.append((int(f[0], 16), int(f[1], 16), int(f[2]), int(f[3]), tg))

          seeds = [(e, th) for e, th, rs, nm in funcs]
          n_func_seeds = len(seeds)
          for site, t0, bound, n, tg in tables:
              for t in tg:
                  seeds.append((t & ~1, bool(t & 1)))

          # ---------- follow the code ----------
          md_a = Cs(CS_ARCH_ARM, CS_MODE_ARM)
          md_t = Cs(CS_ARCH_ARM, CS_MODE_THUMB)
          cov = bytearray(SIZE)
          istart = {}
          kinds = collections.Counter()
          problems = collections.Counter()
          indirect = []
          bad_list = []
          overlap_list = []
          work = list(reversed(seeds))

          while work:
              addr, thumb = work.pop()
              while True:
                  if not (TEXT_LO <= addr < TEXT_HI):
                      problems['target outside .text'] += 1
                      break
                  if addr in istart:
                      break
                  if addr & (1 if thumb else 3):
                      problems['misaligned target'] += 1
                      break
                  off = addr - TEXT_LO
                  md = md_t if thumb else md_a
                  res = list(md.disasm_lite(code[off:off + 8], addr, 1))
                  if not res:
                      problems['undecodable'] += 1
                      bad_list.append(addr)
                      break
                  _, size, mn, op = res[0]
                  if any(cov[off:off + size]):
                      problems['overlaps a decoded instruction'] += 1
                      overlap_list.append(addr)
                      break
                  cov[off:off + size] = b'\x01' * size
                  istart[addr] = (size, thumb)

                  low = mn.lower().split('.')[0]
                  base, cc = split_cc(low)
                  uncond = (cc == 'al')
                  stop = False
                  m = IMM.search(op)
                  opn = op.replace(' ', '')

                  if low in ('cbz', 'cbnz'):
                      if m:
                          work.append((int(m.group(1), 0) & ~1, thumb))
                      kinds['cbz/cbnz'] += 1
                  elif base == 'b':
                      if m:
                          work.append((int(m.group(1), 0) & ~1, thumb))
                          kinds['direct branch'] += 1
                          stop = uncond
                      else:
                          kinds['b without target?'] += 1
                  elif base == 'bl':
                      if m:
                          work.append((int(m.group(1), 0) & ~1, thumb))
                      kinds['direct call'] += 1
                  elif base == 'blx':
                      if m:
                          work.append((int(m.group(1), 0) & ~1, not thumb))
                          kinds['direct call (mode switch)'] += 1
                      else:
                          kinds['indirect call (blx reg)'] += 1
                          indirect.append((addr, 'blx reg', thumb))
                  elif base in ('bx', 'bxj'):
                      if opn == 'lr':
                          kinds['return (bx lr)'] += 1
                      else:
                          kinds['indirect jump (bx reg)'] += 1
                          indirect.append((addr, 'bx reg', thumb))
                      stop = uncond
                  elif base in ('tbb', 'tbh'):
                      kinds['thumb table branch'] += 1
                      indirect.append((addr, base, thumb))
                      stop = uncond
                  elif base in LDM and re.search(r'\bpc\b', op):
                      if opn.startswith('sp'):
                          kinds['return (pop/ldm pc)'] += 1
                      else:
                          kinds['indirect jump (ldm pc)'] += 1
                          indirect.append((addr, 'ldm pc', thumb))
                      stop = uncond
                  elif base in PCW and opn.startswith('pc,'):
                      if base == 'ldr' and re.match(r'pc,\[pc,', opn):
                          kinds['switch (ldr pc,[pc,..])'] += 1
                      elif base == 'ldr' and '[sp' in opn:
                          kinds['return (ldr pc,[sp])'] += 1
                      elif base in ('mov', 'cpy') and opn.endswith('lr'):
                          kinds['return (mov pc,lr)'] += 1
                      else:
                          kinds['other pc write: ' + base] += 1
                          indirect.append((addr, 'pc write ' + base, thumb))
                      stop = uncond
                  elif base in ('udf', 'bkpt'):
                      kinds['udf/bkpt'] += 1
                      stop = True

                  addr += size
                  if stop:
                      break

          # ---------- compare with Ghidra ----------
          def I(b):
              return int.from_bytes(b, 'little')
          ci, fi, ui, di = I(cov), I(func), I(undef), I(data)
          reached = ci.bit_count()
          in_func = (ci & fi).bit_count()
          func_total = fi.bit_count()
          outside = ci & ~fi
          out_total = outside.bit_count()
          out_undef = (outside & ui).bit_count()
          out_data = (outside & di).bit_count()
          out_other = out_total - out_undef - out_data
          code_in_data = (ci & di).bit_count()

          os.makedirs('reports', exist_ok=True)

          def runs(mask, lo_a, hi_a, val):
              pat = re.compile((b'\x01+' if val else b'\x00+'))
              return [(lo_a + mt.start(), mt.end() - mt.start()) for mt in pat.finditer(mask[lo_a:hi_a])]

          unreached = []
          for entry, th, rs, nm in funcs:
              for lo, hi in rs:
                  a, b = lo - TEXT_LO, min(hi + 1 - TEXT_LO, SIZE)
                  if 0 <= a < SIZE:
                      for s, n in runs(cov, a, b, False):
                          unreached.append((s + TEXT_LO - a + a, n, nm))
          # note: runs() offsets are relative to the slice; fix below
          unreached = []
          for entry, th, rs, nm in funcs:
              for lo, hi in rs:
                  a, b = lo - TEXT_LO, min(hi + 1 - TEXT_LO, SIZE)
                  if 0 <= a < SIZE:
                      sub = cov[a:b]
                      for mt in re.finditer(b'\x00+', bytes(sub)):
                          unreached.append((TEXT_LO + a + mt.start(), mt.end() - mt.start(), nm))
          unreached.sort(key=lambda t: -t[1])
          unreached_bytes = sum(n for s, n, nm in unreached)

          def scan_runs(selector):
              out = []
              sel = bytes(selector)
              for mt in re.finditer(b'\x01+', sel):
                  out.append((TEXT_LO + mt.start(), mt.end() - mt.start()))
              return out

          both_undef = bytearray(a & b for a, b in zip(cov, undef))
          both_data = bytearray(a & b for a, b in zip(cov, data))
          new_in_undef = scan_runs(both_undef)
          in_data_runs = scan_runs(both_data)

          entries_unreached = sum(1 for e, th, rs, nm in funcs if e not in istart)

          jt_ok = jt_unreached = jt_over = 0
          for site, t0, bound, n, tg in tables:
              end = t0 + 4 * n
              miss = sum(1 for t in tg if (t & ~1) not in istart)
              jt_unreached += miss
              if any(t0 <= (t & ~1) < end for t in tg):
                  jt_over += 1
              if miss == 0:
                  jt_ok += 1

          n_arm = sum(1 for a, (s, th) in istart.items() if not th)
          n_thumb = len(istart) - n_arm

          out = []
          def p(s=''):
              out.append(s)
          p('seeds: %d function entries + %d jump table targets' % (n_func_seeds, len(seeds) - n_func_seeds))
          p('reached instructions: %d (arm %d, thumb %d), bytes %d' % (len(istart), n_arm, n_thumb, reached))
          p('function entries never reached (decode failure): %d' % entries_unreached)
          p('--- compared with Ghidra function ranges (%d bytes) ---' % func_total)
          p('  reached: %d' % in_func)
          p('  not reached: %d bytes in %d pieces' % (func_total - in_func, len(unreached)))
          p('--- reached code outside Ghidra function ranges: %d bytes ---' % out_total)
          p('  in bytes Ghidra left undefined (newly found code): %d' % out_undef)
          p('  in bytes Ghidra marked as data (conflict): %d' % out_data)
          p('  other (decoded by Ghidra but outside any function): %d' % out_other)
          p('  total reached bytes inside Ghidra data ranges: %d' % code_in_data)
          p('--- traversal problems ---')
          for k, v in problems.most_common():
              p('  %s: %d' % (k, v))
          p('--- control-flow kinds ---')
          for k, v in sorted(kinds.items(), key=lambda kv: -kv[1]):
              p('  %s: %d' % (k, v))
          ik = collections.Counter(k for a, k, th in indirect)
          p('--- sites with unresolved targets (need runtime lookup) ---')
          for k, v in ik.most_common():
              p('  %s: %d' % (k, v))
          p('--- jump tables ---')
          p('tables: %d, all targets reached: %d, unreached targets: %d, tables containing their own targets: %d'
            % (len(tables), jt_ok, jt_unreached, jt_over))
          p('--- 15 largest unreached function pieces ---')
          for s, n, nm in unreached[:15]:
              p('  0x%08x size %d in %s' % (s, n, nm))
          p('--- first 10 runs of newly found code in undefined bytes ---')
          for s, n in new_in_undef[:10]:
              p('  0x%08x size %d' % (s, n))
          p('--- first 10 runs of reached code inside Ghidra data ---')
          for s, n in in_data_runs[:10]:
              p('  0x%08x size %d' % (s, n))
          p('--- first 10 undecodable and 10 overlapping targets ---')
          for a in bad_list[:10]:
              p('  undecodable 0x%08x' % a)
          for a in overlap_list[:10]:
              p('  overlap 0x%08x' % a)

          open('reports/reach_summary.txt', 'w').write('\n'.join(out) + '\n')

          with open('reports/reachable_ranges.tsv', 'w') as w:
              w.write('# start\tlength\tmode(A/T)\n')
              cur = None
              for a in sorted(istart):
                  s, th = istart[a]
                  if cur and cur[0] + cur[1] == a and cur[2] == th:
                      cur[1] += s
                  else:
                      if cur:
                          w.write('0x%08x\t%d\t%s\n' % (cur[0], cur[1], 'T' if cur[2] else 'A'))
                      cur = [a, s, th]
              if cur:
                  w.write('0x%08x\t%d\t%s\n' % (cur[0], cur[1], 'T' if cur[2] else 'A'))
          with open('reports/indirect_sites.tsv', 'w') as w:
              w.write('# address\tkind\tmode\n')
              for a, k, th in sorted(indirect):
                  w.write('0x%08x\t%s\t%s\n' % (a, k, 'T' if th else 'A'))
          with open('reports/unreached_function_pieces.tsv', 'w') as w:
              for s, n, nm in sorted(unreached):
                  w.write('0x%08x\t%d\t%s\n' % (s, n, nm))
          with open('reports/new_code_in_undefined.tsv', 'w') as w:
              for s, n in new_in_undef:
                  w.write('0x%08x\t%d\n' % (s, n))
          with open('reports/code_in_data.tsv', 'w') as w:
              for s, n in in_data_runs:
                  w.write('0x%08x\t%d\n' % (s, n))
          print('done')
          PY

      - name: Run reachability
        run: python3 reach.py

      - name: Save results to cache
        uses: actions/cache/save@v4
        with:
          path: reports
          key: albw-reach-${{ github.run_id }}

      - name: Show reports
        run: |
          echo "Reachability cache key: albw-reach-${{ github.run_id }}"
          cat reports/reach_summary.txt
          ls -l reports

      - name: Upload reports (addresses and counts only)
        uses: actions/upload-artifact@v4
        with:
          name: albw-reach
          path: reports/*
          retention-days: 7

