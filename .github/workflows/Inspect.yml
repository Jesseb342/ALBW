name: Inspect ALBW dump

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download dump
        env:
          ALBW_URL: "https://drive.usercontent.google.com/download?id=1ypm1CGmbkAgkRBdLHvxhjJo-a3BYvTE2&export=download&confirm=t"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -A "Mozilla/5.0" -o dump.bin "$ALBW_URL"
          ls -lh dump.bin

      - name: Inspect ExeFS and RomFS
        run: |
          python3 - <<'EOF'
          import struct
          f = open('dump.bin', 'rb')

          def rd(o, n):
              f.seek(o)
              return f.read(n)

          def u32(o):
              return struct.unpack('<I', rd(o, 4))[0]

          base = u32(0x120) * 0x200
          print('NCCH at', hex(base), rd(base + 0x100, 4))
          print('flags:', rd(base + 0x188, 8).hex())

          exefs_off = u32(base + 0x1A0) * 0x200
          exefs_size = u32(base + 0x1A4) * 0x200
          romfs_off = u32(base + 0x1B0) * 0x200
          romfs_size = u32(base + 0x1B4) * 0x200
          print('ExeFS offset', hex(base + exefs_off), 'size', hex(exefs_size))
          print('RomFS offset', hex(base + romfs_off), 'size', hex(romfs_size))

          # ExeFS header: 10 entries of name(8) offset(4) size(4)
          print('--- ExeFS file table ---')
          hdr = rd(base + exefs_off, 0xA0)
          for i in range(10):
              e = hdr[i * 16:(i + 1) * 16]
              name = e[:8].rstrip(b'\0')
              off, size = struct.unpack('<II', e[8:])
              if name:
                  print(repr(name), 'offset', hex(off), 'size', hex(size))
          print('table is plain text:', all(
              32 <= b < 127 or b == 0 for b in hdr[:8]))

          # RomFS starts with an IVFC header if decrypted
          print('--- RomFS magic ---')
          print(rd(base + romfs_off, 4))

          # Extended header begins with the app title if decrypted
          print('--- ExHeader title ---')
          print(rd(base + 0x200, 8))
          EOF

