name: ALBW translator milestone 2

on:
  workflow_dispatch:
    inputs:
      export_key:
        description: "Export cache key"
        required: true
        default: "albw-export-38100867527"
      trials:
        description: "Random trials per function"
        required: true
        default: "30"
      max_functions:
        description: "Max functions to test"
        required: true
        default: "400"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Restore export
        uses: actions/cache/restore@v4
        with:
          path: export
          key: ${{ inputs.export_key }}
          fail-on-cache-miss: true

      - name: Download dump
        env:
          ALBW_URL: "https://drive.usercontent.google.com/download?id=1ypm1CGmbkAgkRBdLHvxhjJo-a3BYvTE2&export=download&confirm=t"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            -A "Mozilla/5.0" -o dump.bin "$ALBW_URL"
          ls -lh dump.bin

      - name: Pull out .code
        run: |
          python3 - <<'EOF'
          import struct
          f = open('dump.bin', 'rb')
          def rd(o, n):
              f.seek(o)
              return f.read(n)
          def u32(o):
              return struct.unpack('<I', rd(o, 4))[0]
          base = u32(0x120) * 0x200
          assert rd(base + 0x100, 4) == b'NCCH'
          exefs = base + u32(base + 0x1A0) * 0x200
          hdr = rd(exefs, 0xA0)
          code_off = code_size = None
          for i in range(10):
              e = hdr[i * 16:(i + 1) * 16]
              if e[:8].rstrip(b'\0') == b'.code':
                  code_off, code_size = struct.unpack('<II', e[8:])
          assert code_size == 0x628000, hex(code_size)
          code = rd(exefs + 0x200 + code_off, code_size)
          assert struct.unpack_from('<I', code, 0)[0] == 0xEB000007
          open('code.bin', 'wb').write(code)
          print('wrote code.bin', len(code))
          EOF
          rm dump.bin

      - name: Install tools
        run: pip install capstone unicorn numpy

      - name: Write translator
        run: |
          cat > tr.py <<'PY'
          import os, re, sys, struct, collections, random, subprocess, time
          import numpy as np
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_ARM
          from unicorn import Uc, UC_ARCH_ARM, UC_MODE_ARM, UcError
          from unicorn import UC_PROT_ALL, UC_PROT_READ, UC_PROT_EXEC
          from unicorn import arm_const as A

          TEXT_LO = 0x100000
          TEXT_HI = 0x69211c
          CODE_LEN = 0x628000
          SCR_BASE = 0x730000
          SCR_SIZE = 0x2000
          RET_ADDR = 0x00F00000
          SP_INIT = SCR_BASE + 0x1F00
          TRIALS = int(os.environ.get('TRIALS', '30'))
          MAXF = int(os.environ.get('MAXF', '400'))
          LINEMAX = 2000
          CLOSURE_MAX = 30
          MINSIZE = 8

          code = open('code.bin', 'rb').read()
          assert len(code) == CODE_LEN
          md = Cs(CS_ARCH_ARM, CS_MODE_ARM)
          t0 = time.time()
          ENTRIES = set()

          class Unsupp(Exception):
              pass

          CCS = ['eq', 'ne', 'cs', 'cc', 'hs', 'lo', 'mi', 'pl', 'vs', 'vc', 'hi', 'ls', 'ge', 'lt', 'gt', 'le']
          VKNOWN = set('vldr vstr vmov vmul vmla vmls vnmla vnmls vnmul vadd vsub vdiv vsqrt vabs vneg vcmp vcmpe vcvt vmrs vmsr vpush vpop vldmia vldmdb vstmia vstmdb mrc mcr mrc2 mcr2 svc swi ldc stc cdp'.split())

          def mnem(w, addr):
              try:
                  for ins in md.disasm(struct.pack('<I', w), addr):
                      m = ins.mnemonic.split('.')[0]
                      if m not in VKNOWN and len(m) > 2 and m[-2:] in CCS and m[:-2] in VKNOWN:
                          m = m[:-2]
                      return m
              except Exception:
                  pass
              return '?'

          def ror32(v, n):
              n &= 31
              return (((v >> n) | (v << (32 - n))) & 0xFFFFFFFF) if n else v

          CONDC = {0: 'Z', 1: '!Z', 2: 'C', 3: '!C', 4: 'N', 5: '!N', 6: 'V', 7: '!V',
                   8: '(C && !Z)', 9: '(!C || Z)', 10: '(N == V)', 11: '(N != V)',
                   12: '(!Z && N == V)', 13: '(Z || N != V)'}

          def rexp(n, addr):
              if n == 15:
                  return '0x%08xu' % ((addr + 8) & 0xFFFFFFFF)
              return 'r[%d]' % n

          def shift_nocarry(rm, st, n, addr):
              v = rexp(rm, addr)
              if st == 0:
                  return 'SHL(%s, %du)' % (v, n)
              if st == 1:
                  return 'SHR(%s, %du)' % (v, 32 if n == 0 else n)
              if st == 2:
                  return 'SAR(%s, %du)' % (v, 32 if n == 0 else n)
              if n == 0:
                  return 'RRXC(%s, C)' % v
              return 'ROR(%s, %du)' % (v, n)

          def memop(P, U, W, L, rn, rd, off, kind, addr):
              if rn == 15 and (W or not P):
                  raise Unsupp('pc base with writeback or post-index')
              if (W or not P) and rn == rd:
                  raise Unsupp('load/store writeback to the transferred register')
              op = '+' if U else '-'
              s = 'uint32_t b = %s, o = %s, a; ' % (rexp(rn, addr), off)
              s += 'a = %s; ' % (('b %s o' % op) if P else 'b')
              if L:
                  acc = {'W': 'RD32(a)', 'B': 'RD8(a)', 'H': 'RD16(a)',
                         'SB': '(uint32_t)(int32_t)(int8_t)RD8(a)',
                         'SH': '(uint32_t)(int32_t)(int16_t)RD16(a)'}[kind]
                  s += 'r[%d] = %s; ' % (rd, acc)
              else:
                  s += 'WR%s(a, r[%d]); ' % ({'W': '32', 'B': '8', 'H': '16'}[kind], rd)
              if P and W:
                  s += 'r[%d] = a; ' % rn
              if not P:
                  s += 'r[%d] = b %s o; ' % (rn, op)
              return '{ ' + s + '}'

          def halfword(w, addr):
              P = (w >> 24) & 1
              U = (w >> 23) & 1
              I = (w >> 22) & 1
              W = (w >> 21) & 1
              L = (w >> 20) & 1
              rn = (w >> 16) & 15
              rd = (w >> 12) & 15
              sh = (w >> 5) & 3
              if sh == 0:
                  raise Unsupp('swp/ldrex/strex (sync)')
              if I:
                  off = '%du' % (((w >> 4) & 0xF0) | (w & 0xF))
              else:
                  rm = w & 15
                  if rm == 15:
                      raise Unsupp('halfword transfer offset is pc')
                  off = 'r[%d]' % rm
              if (not P) and W:
                  raise Unsupp('ldrht/strht')
              if (not L) and sh in (2, 3):
                  rd2 = rd + 1
                  if (rd & 1) or rd >= 14:
                      raise Unsupp('ldrd/strd with odd or high register pair')
                  if rn == 15 and (W or not P):
                      raise Unsupp('pc base with writeback or post-index')
                  if (W or not P) and rn in (rd, rd2):
                      raise Unsupp('ldrd/strd writeback overlaps the data registers')
                  op = '+' if U else '-'
                  s = 'uint32_t b = %s, o = %s, a; ' % (rexp(rn, addr), off)
                  s += 'a = %s; ' % (('b %s o' % op) if P else 'b')
                  s += 'if (a & 7u) g_unal = 1; '
                  if sh == 2:
                      s += 'r[%d] = RD32(a); r[%d] = RD32(a + 4u); ' % (rd, rd2)
                  else:
                      s += 'WR32(a, r[%d]); WR32(a + 4u, r[%d]); ' % (rd, rd2)
                  if P and W:
                      s += 'r[%d] = a; ' % rn
                  if not P:
                      s += 'r[%d] = b %s o; ' % (rn, op)
                  return '{ ' + s + '}'
              if rd == 15:
                  raise Unsupp('halfword transfer with pc')
              return memop(P, U, W, L, rn, rd, off, {1: 'H', 2: 'SB', 3: 'SH'}[sh], addr)

          def media(w, addr):
              rd = (w >> 12) & 15
              rm = w & 15
              rn = (w >> 16) & 15
              top = (w >> 20) & 0xFF
              low = (w >> 4) & 15
              if rd == 15 or rm == 15:
                  raise Unsupp('media instruction with pc')
              if (w & 0x0FFF0FF0) == 0x06BF0F30:
                  return '{ r[%d] = __builtin_bswap32(r[%d]); }' % (rd, rm)
              if (w & 0x0FFF0FF0) == 0x06BF0FB0:
                  return ('{ uint32_t x = r[%d]; r[%d] = ((x & 0xFF00FF00u) >> 8) | ((x & 0x00FF00FFu) << 8); }'
                          % (rm, rd))
              if (w & 0x0FFF0FF0) == 0x06FF0FB0:
                  return ('{ uint32_t x = r[%d]; r[%d] = (uint32_t)(int32_t)(int16_t)(uint16_t)(((x & 0xFFu) << 8) | ((x >> 8) & 0xFFu)); }'
                          % (rm, rd))
              if low == 7 and (w & 0x300) == 0 and top in (0x6A, 0x6B, 0x6E, 0x6F):
                  rot = ((w >> 10) & 3) * 8
                  v = 'ROR(r[%d], %du)' % (rm, rot)
                  ext = {0x6A: '(uint32_t)(int32_t)(int8_t)(%s)',
                         0x6B: '(uint32_t)(int32_t)(int16_t)(%s)',
                         0x6E: '((%s) & 0xFFu)',
                         0x6F: '((%s) & 0xFFFFu)'}[top] % v
                  if rn != 15:
                      ext = 'r[%d] + %s' % (rn, ext)
                  return '{ r[%d] = %s; }' % (rd, ext)
              raise Unsupp('media instruction (other: sel/pkh/usat/ssat/parallel add)')

          def single(w, cls, addr):
              if cls == 3 and (w & 0x10):
                  return media(w, addr), False
              P = (w >> 24) & 1
              U = (w >> 23) & 1
              B = (w >> 22) & 1
              W = (w >> 21) & 1
              L = (w >> 20) & 1
              rn = (w >> 16) & 15
              rd = (w >> 12) & 15
              if (not P) and W:
                  raise Unsupp('ldrt/strt')
              if cls == 2:
                  off = '%du' % (w & 0xFFF)
              else:
                  rm = w & 15
                  if rm == 15:
                      raise Unsupp('register offset is pc')
                  off = shift_nocarry(rm, (w >> 5) & 3, (w >> 7) & 31, addr)
              if rd == 15:
                  if L and rn == 13 and (not P) and cls == 2 and U and not B:
                      return '{ uint32_t b = r[13]; r[15] = RD32(b); r[13] = b + %s; goto done; }' % off, True
                  raise Unsupp('ldr/str with pc as the data register (switch or computed jump)')
              return memop(P, U, W, L, rn, rd, off, 'B' if B else 'W', addr), False

          def block(w, addr):
              P = (w >> 24) & 1
              U = (w >> 23) & 1
              S = (w >> 22) & 1
              W = (w >> 21) & 1
              L = (w >> 20) & 1
              rn = (w >> 16) & 15
              lst = w & 0xFFFF
              if S:
                  raise Unsupp('ldm/stm with S bit')
              if lst == 0 or rn == 15:
                  raise Unsupp('ldm/stm with empty list or pc base')
              regs = [i for i in range(16) if (lst >> i) & 1]
              n = len(regs)
              if (not L) and 15 in regs:
                  raise Unsupp('stm with pc in list')
              if L and 15 in regs and rn != 13:
                  raise Unsupp('ldm into pc from a non-sp base')
              if W and rn in regs:
                  raise Unsupp('ldm/stm writeback with base in list')
              if U and not P:
                  start = 'b'
              elif U and P:
                  start = 'b + 4u'
              elif (not U) and (not P):
                  start = 'b - %du' % (4 * n - 4)
              else:
                  start = 'b - %du' % (4 * n)
              s = 'uint32_t b = r[%d], a = %s; ' % (rn, start)
              for i in regs:
                  if L:
                      s += 'r[%d] = RD32(a); a += 4u; ' % i
                  else:
                      s += 'WR32(a, r[%d]); a += 4u; ' % i
              if W:
                  s += 'r[%d] = b %s %du; ' % (rn, '+' if U else '-', 4 * n)
              end = False
              if L and 15 in regs:
                  s += 'goto done; '
                  end = True
              return '{ ' + s + '}', end

          def call_code(tgt, ra, tail):
              s = '{ memcpy(c->r, r, sizeof r); c->N = N; c->Z = Z; c->C = C; c->V = V; '
              if not tail:
                  s += 'c->r[14] = 0x%08xu; ' % ra
              s += 'f_%08x(c); ' % tgt
              s += 'memcpy(r, c->r, sizeof r); N = c->N; Z = c->Z; C = c->C; V = c->V; '
              s += 'if (c->status) goto done; '
              if tail:
                  s += 'goto done; }'
              else:
                  s += 'if (r[15] != 0x%08xu) { c->status = 2; goto done; } }' % ra
              return s

          def branch(w, addr, lo, hix, deps):
              L = (w >> 24) & 1
              off = w & 0xFFFFFF
              if off & 0x800000:
                  off -= 0x1000000
              tgt = (addr + 8 + off * 4) & 0xFFFFFFFF
              if L:
                  if tgt not in ENTRIES:
                      raise Unsupp('bl to something that is not a single-range ARM function (thumb, split or unknown)')
                  deps.add(tgt)
                  return call_code(tgt, (addr + 4) & 0xFFFFFFFF, False), False
              if lo <= tgt < hix:
                  return 'if (++g_steps > LIMIT) { c->status = 1; goto done; } goto L_%08x;' % tgt, True
              if tgt in ENTRIES:
                  deps.add(tgt)
                  return call_code(tgt, 0, True), True
              raise Unsupp('branch leaves the function (shared code or non-function target)')

          def longmul(w):
              op = (w >> 21) & 3
              S = (w >> 20) & 1
              rdhi = (w >> 16) & 15
              rdlo = (w >> 12) & 15
              rs = (w >> 8) & 15
              rm = w & 15
              if 15 in (rdhi, rdlo, rs, rm) or rdhi == rdlo:
                  raise Unsupp('long multiply with pc or overlapping result registers')
              s = 'uint64_t p; '
              if op >= 2:
                  s += 'p = (uint64_t)((int64_t)(int32_t)r[%d] * (int64_t)(int32_t)r[%d]); ' % (rm, rs)
              else:
                  s += 'p = (uint64_t)r[%d] * (uint64_t)r[%d]; ' % (rm, rs)
              if op & 1:
                  s += 'p += (((uint64_t)r[%d]) << 32) | r[%d]; ' % (rdhi, rdlo)
              s += 'r[%d] = (uint32_t)p; r[%d] = (uint32_t)(p >> 32); ' % (rdlo, rdhi)
              if S:
                  s += 'N = r[%d] >> 31; Z = (p == 0); ' % rdhi
              return '{ ' + s + '}'

          def dataproc(w, cls, addr):
              op = (w >> 21) & 15
              S = (w >> 20) & 1
              rn = (w >> 16) & 15
              rd = (w >> 12) & 15
              if 8 <= op <= 11 and not S:
                  raise Unsupp('misc (mrs/msr/qadd/movw/hint)')
              pre = 'uint32_t sc = C;'
              if cls == 1:
                  rot = (w >> 8) & 15
                  imm = ror32(w & 0xFF, rot * 2)
                  o2 = '0x%08xu' % imm
                  if rot:
                      pre += ' sc = %du;' % (imm >> 31)
                  rm = None
              else:
                  rm = w & 15
                  st = (w >> 5) & 3
                  if (w & 0x10) == 0:
                      n = (w >> 7) & 31
                      v = rexp(rm, addr)
                      if st == 0:
                          o2 = 'shl_c(%s, %du, C, &sc)' % (v, n)
                      elif st == 1:
                          o2 = 'shr_c(%s, %du, C, &sc)' % (v, 32 if n == 0 else n)
                      elif st == 2:
                          o2 = 'sar_c(%s, %du, C, &sc)' % (v, 32 if n == 0 else n)
                      elif n == 0:
                          o2 = 'rrx_c(%s, C, &sc)' % v
                      else:
                          o2 = 'ror_c(%s, %du, C, &sc)' % (v, n)
                  else:
                      rs = (w >> 8) & 15
                      if rm == 15 or rs == 15 or (rn == 15 and op not in (13, 15)):
                          raise Unsupp('register-shifted operand using pc')
                      o2 = '%s(r[%d], r[%d] & 0xFFu, C, &sc)' % (['shl_c', 'shr_c', 'sar_c', 'ror_c'][st], rm, rs)
              if rd == 15 and not (8 <= op <= 11):
                  if op == 13 and not S and cls == 0 and (w & 0xFFF) == 14:
                      return 'r[15] = r[14]; goto done;', True
                  raise Unsupp('data-processing write to pc')
              s = pre + ' uint32_t o2 = %s;' % o2
              if op not in (13, 15):
                  s += ' uint32_t a = %s;' % rexp(rn, addr)
              s += ' uint32_t res; uint64_t t; (void)t;'
              nz = ' N = res >> 31; Z = (res == 0);' if S else ''
              lg = nz + (' C = sc;' if S else '')

              def sub(x, y):
                  r = ' res = %s - %s;' % (x, y)
                  if S:
                      r += ' C = (%s >= %s); V = ((%s ^ %s) & (%s ^ res)) >> 31;' % (x, y, x, y, x)
                  return r + nz

              def add(x, y, carry):
                  r = ' t = (uint64_t)%s + %s%s; res = (uint32_t)t;' % (x, y, ' + C' if carry else '')
                  if S:
                      r += ' C = (uint32_t)(t >> 32); V = ((%s ^ res) & (%s ^ res)) >> 31;' % (x, y)
                  return r + nz

              def sbc(x, y):
                  r = ' t = (uint64_t)%s + (uint32_t)~%s + C; res = (uint32_t)t;' % (x, y)
                  if S:
                      r += ' C = (uint32_t)(t >> 32); V = ((%s ^ %s) & (%s ^ res)) >> 31;' % (x, y, x)
                  return r + nz

              if op == 0 or op == 8:
                  s += ' res = a & o2;' + lg
              elif op == 1 or op == 9:
                  s += ' res = a ^ o2;' + lg
              elif op == 2 or op == 10:
                  s += sub('a', 'o2')
              elif op == 3:
                  s += sub('o2', 'a')
              elif op == 4 or op == 11:
                  s += add('a', 'o2', False)
              elif op == 5:
                  s += add('a', 'o2', True)
              elif op == 6:
                  s += sbc('a', 'o2')
              elif op == 7:
                  s += sbc('o2', 'a')
              elif op == 12:
                  s += ' res = a | o2;' + lg
              elif op == 13:
                  s += ' res = o2;' + lg
              elif op == 14:
                  s += ' res = a & ~o2;' + lg
              else:
                  s += ' res = ~o2;' + lg
              if not (8 <= op <= 11):
                  s += ' r[%d] = res;' % rd
              return '{ ' + s + ' }', False

          def xlat(w, addr, lo, hix, deps):
              cc = w >> 28
              if cc == 15:
                  if (w & 0xFF30F000) == 0xF510F000 or (w & 0xFF30F010) == 0xF710F000:
                      return '', False
                  raise Unsupp('unconditional-space instruction (blx imm, cps, srs, etc)')
              cls = (w >> 25) & 7
              end = False
              if (w & 0x0FFFFFFF) == 0x0320F000:
                  body = ''
              elif cls == 0 and (w & 0x0FFFFFF0) == 0x012FFF10:
                  if (w & 15) != 14:
                      raise Unsupp('bx to a register other than lr (indirect jump)')
                  body = 'r[15] = r[14]; goto done;'
                  end = True
              elif cls == 0 and (w & 0x0FFFFFF0) == 0x012FFF30:
                  raise Unsupp('blx register (indirect call)')
              elif cls == 0 and (w & 0x0FFF0FF0) == 0x016F0F10:
                  rd = (w >> 12) & 15
                  rm = w & 15
                  if rd == 15 or rm == 15:
                      raise Unsupp('clz with pc')
                  body = '{ r[%d] = r[%d] ? (uint32_t)__builtin_clz(r[%d]) : 32u; }' % (rd, rm, rm)
              elif cls == 0 and (w & 0x0FC000F0) == 0x00000090:
                  A_ = (w >> 21) & 1
                  S = (w >> 20) & 1
                  rd = (w >> 16) & 15
                  rn = (w >> 12) & 15
                  rs = (w >> 8) & 15
                  rm = w & 15
                  if 15 in (rd, rs, rm) or (A_ and rn == 15):
                      raise Unsupp('mul/mla with pc')
                  body = '{ uint32_t res = r[%d] * r[%d]%s; r[%d] = res;%s }' % (
                      rm, rs, (' + r[%d]' % rn) if A_ else '', rd,
                      ' N = res >> 31; Z = (res == 0);' if S else '')
              elif cls == 0 and (w & 0x0F8000F0) == 0x00800090:
                  body = longmul(w)
              elif cls == 0 and (w & 0x90) == 0x90:
                  body = halfword(w, addr)
              elif cls in (0, 1):
                  body, end = dataproc(w, cls, addr)
              elif cls in (2, 3):
                  body, end = single(w, cls, addr)
              elif cls == 4:
                  body, end = block(w, addr)
              elif cls == 5:
                  body, end = branch(w, addr, lo, hix, deps)
              else:
                  raise Unsupp('vfp/coproc/svc: ' + mnem(w, addr))
              if cc != 14:
                  body = 'if (%s) { %s }' % (CONDC[cc], body)
                  end = False
              return body, end

          def scan(lo, hix, want, deps):
              n = (hix - lo) // 4
              words = struct.unpack_from('<%dI' % n, code, lo - TEXT_LO)
              pool = set()
              for i, w in enumerate(words):
                  a = lo + 4 * i
                  if ((w >> 28) != 15 and ((w >> 25) & 7) == 2 and ((w >> 16) & 15) == 15
                          and (w >> 20) & 1 and (w >> 24) & 1
                          and not (w >> 22) & 1 and not (w >> 21) & 1):
                      off = w & 0xFFF
                      t = a + 8 + (off if (w >> 23) & 1 else -off)
                      if lo <= t < hix and t % 4 == 0:
                          pool.add(t)
              reasons = []
              lines = []
              last_end = False
              count = 0
              for i, w in enumerate(words):
                  a = lo + 4 * i
                  if a in pool:
                      if want:
                          lines.append('L_%08x: ;' % a)
                      continue
                  count += 1
                  try:
                      body, end = xlat(w, a, lo, hix, deps)
                      if want:
                          lines.append('L_%08x: ; %s' % (a, body))
                      last_end = end
                  except Unsupp as e:
                      reasons.append(str(e))
                      last_end = False
              if not reasons and not last_end:
                  reasons.append('falls off the end of the function')
              return reasons, lines, count

          # ---------- load function list ----------
          funcs = []
          for line in open('export/functions.tsv'):
              if line.startswith('#') or not line.strip():
                  continue
              entry, mode, size, ranges, name = line.rstrip('\n').split('\t')
              rs = []
              for part in ranges.split(';'):
                  a, b = part.split('-')
                  rs.append((int(a, 16), int(b, 16)))
              funcs.append((int(entry, 16), mode, rs))

          func_blockers = collections.Counter()
          instr_blockers = collections.Counter()
          total_funcs = len(funcs)
          n_thumb = n_multi = 0
          meta = {}
          for entry, mode, rs in funcs:
              if mode == 'T':
                  n_thumb += 1
                  func_blockers['thumb function'] += 1
                  continue
              if len(rs) != 1:
                  n_multi += 1
                  func_blockers['function split over several ranges'] += 1
                  continue
              lo, hi = rs[0]
              if lo < TEXT_LO or hi >= TEXT_HI or lo % 4 or (hi + 1 - lo) % 4 or entry != lo:
                  func_blockers['odd range or entry not at start'] += 1
                  continue
              meta[entry] = (lo, hi + 1)
          ENTRIES.update(meta.keys())
          n_single = len(meta)

          info = {}
          instr_total = instr_ok = 0
          for entry in sorted(meta):
              lo, hix = meta[entry]
              deps = set()
              want = (hix - lo) <= LINEMAX
              reasons, lines, n = scan(lo, hix, want, deps)
              info[entry] = {'reasons': reasons, 'deps': deps, 'lines': (lines if want else None), 'n': n}
              instr_total += n
              nb = len([r for r in reasons if r != 'falls off the end of the function'])
              instr_ok += n - nb
              for r in reasons:
                  instr_blockers[r] += 1

          ok = set(e for e in info if not info[e]['reasons'])
          locally_ok = len(ok)
          changed = True
          while changed:
              changed = False
              for e in sorted(ok):
                  if any(d not in ok for d in info[e]['deps']):
                      ok.discard(e)
                      changed = True
          for e in info:
              if e in ok:
                  func_blockers['SUPPORTED'] += 1
              elif info[e]['reasons']:
                  func_blockers['first blocker: ' + info[e]['reasons'][0]] += 1
              else:
                  func_blockers['calls a function that is not translatable yet'] += 1

          dependents = collections.Counter()
          for e in info:
              if e not in ok and not info[e]['reasons']:
                  for d in info[e]['deps']:
                      if d not in ok:
                          dependents[d] += 1

          print('scan done in %.0fs' % (time.time() - t0))
          sys.stdout.flush()
          os.makedirs('reports', exist_ok=True)

          with open('reports/translatable_functions.tsv', 'w') as w:
              w.write('# entry\tsize_bytes\tcalls\n')
              for e in sorted(ok):
                  w.write('0x%08x\t%d\t%d\n' % (e, meta[e][1] - meta[e][0], len(info[e]['deps'])))

          # ---------- choose test functions (with the full call tree) ----------
          haslines = set(e for e in ok if info[e]['lines'] is not None)

          def closure(e, limit):
              seen = set()
              stack = [e]
              while stack:
                  x = stack.pop()
                  if x in seen:
                      continue
                  if x not in haslines:
                      return None
                  seen.add(x)
                  if len(seen) > limit:
                      return None
                  stack.extend(info[x]['deps'])
              return seen

          pool_leaf = []
          pool_call = []
          for e in sorted(haslines):
              if meta[e][1] - meta[e][0] < MINSIZE:
                  continue
              c = closure(e, CLOSURE_MAX)
              if c is None:
                  continue
              (pool_call if info[e]['deps'] else pool_leaf).append((e, c))

          def sample(pool, k):
              if k <= 0:
                  return []
              if len(pool) <= k:
                  return list(pool)
              step = len(pool) / float(k)
              return [pool[int(i * step)] for i in range(k)]

          n_call = min(len(pool_call), (2 * MAXF) // 3)
          picked = sample(pool_call, n_call) + sample(pool_leaf, MAXF - n_call)
          selected = [e for e, c in picked]
          call_set = set(e for e, c in picked if info[e]['deps'])
          genset = set()
          for e, c in picked:
              genset |= c
          print('selected %d test functions (%d with calls), %d functions to generate'
                % (len(selected), len(call_set), len(genset)))
          sys.stdout.flush()

          MARK = 't = (uint64_t)a + o2;'
          BAD = 't = (uint64_t)a + o2 + 1u;'
          canary = None
          for e in selected + sorted(genset):
              if MARK in '\n'.join(info[e]['lines']):
                  canary = e
                  break

          RT = r'''
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <setjmp.h>
          #define IMG_LO 0x00100000u
          #define IMG_LEN 0x00628000u
          #define SCR_LO 0x00730000u
          #define SCR_LEN 0x2000u
          #define RET_ADDR 0x00F00000u
          #define LIMIT 20000u
          #define DEPTH_MAX 48u
          typedef struct { uint32_t r[16]; uint32_t N, Z, C, V; int status; } CPU;
          static uint8_t img[IMG_LEN];
          static uint8_t scr[SCR_LEN];
          static jmp_buf jb;
          static int g_unal;
          static uint32_t g_steps, g_depth;
          static void FAULT(void) __attribute__((noreturn));
          static void FAULT(void) { longjmp(jb, 1); }
          static uint8_t *mp(uint32_t a, uint32_t n, int wr) {
            if (a >= IMG_LO && (uint64_t)a + n <= (uint64_t)IMG_LO + IMG_LEN) {
              if (wr) FAULT();
              return img + (a - IMG_LO);
            }
            if (a >= SCR_LO && (uint64_t)a + n <= (uint64_t)SCR_LO + SCR_LEN) return scr + (a - SCR_LO);
            FAULT();
          }
          static uint32_t RD32(uint32_t a) { if (a & 3u) g_unal = 1; uint8_t *p = mp(a, 4, 0); return (uint32_t)p[0] | ((uint32_t)p[1] << 8) | ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24); }
          static uint32_t RD16(uint32_t a) { if (a & 1u) g_unal = 1; uint8_t *p = mp(a, 2, 0); return (uint32_t)p[0] | ((uint32_t)p[1] << 8); }
          static uint32_t RD8(uint32_t a) { return *mp(a, 1, 0); }
          static void WR32(uint32_t a, uint32_t v) { if (a & 3u) g_unal = 1; uint8_t *p = mp(a, 4, 1); p[0] = (uint8_t)v; p[1] = (uint8_t)(v >> 8); p[2] = (uint8_t)(v >> 16); p[3] = (uint8_t)(v >> 24); }
          static void WR16(uint32_t a, uint32_t v) { if (a & 1u) g_unal = 1; uint8_t *p = mp(a, 2, 1); p[0] = (uint8_t)v; p[1] = (uint8_t)(v >> 8); }
          static void WR8(uint32_t a, uint32_t v) { *mp(a, 1, 1) = (uint8_t)v; }
          static uint32_t shl_c(uint32_t v, uint32_t n, uint32_t ci, uint32_t *co) {
            if (n == 0) { *co = ci; return v; }
            if (n < 32) { *co = (v >> (32 - n)) & 1; return v << n; }
            if (n == 32) { *co = v & 1; return 0; }
            *co = 0; return 0;
          }
          static uint32_t shr_c(uint32_t v, uint32_t n, uint32_t ci, uint32_t *co) {
            if (n == 0) { *co = ci; return v; }
            if (n < 32) { *co = (v >> (n - 1)) & 1; return v >> n; }
            if (n == 32) { *co = v >> 31; return 0; }
            *co = 0; return 0;
          }
          static uint32_t sar_c(uint32_t v, uint32_t n, uint32_t ci, uint32_t *co) {
            if (n == 0) { *co = ci; return v; }
            if (n < 32) { *co = (v >> (n - 1)) & 1; return (uint32_t)((int32_t)v >> n); }
            *co = v >> 31; return (v >> 31) ? 0xFFFFFFFFu : 0u;
          }
          static uint32_t ror_c(uint32_t v, uint32_t n, uint32_t ci, uint32_t *co) {
            if (n == 0) { *co = ci; return v; }
            uint32_t a = n & 31u;
            if (a == 0) { *co = v >> 31; return v; }
            *co = (v >> (a - 1)) & 1; return (v >> a) | (v << (32 - a));
          }
          static uint32_t rrx_c(uint32_t v, uint32_t ci, uint32_t *co) { *co = v & 1; return (ci << 31) | (v >> 1); }
          #define SHL(v, n) ({ uint32_t d_; shl_c((v), (n), 0, &d_); })
          #define SHR(v, n) ({ uint32_t d_; shr_c((v), (n), 0, &d_); })
          #define SAR(v, n) ({ uint32_t d_; sar_c((v), (n), 0, &d_); })
          #define ROR(v, n) ({ uint32_t d_; ror_c((v), (n), 0, &d_); })
          #define RRXC(v, cin) ({ uint32_t d_; rrx_c((v), (cin), &d_); })
          typedef void (*fn_t)(CPU *);
          typedef struct { uint32_t addr; fn_t fn; } ent_t;
          '''
          MAIN = r'''
          #define NTABLE ((int)(sizeof(table) / sizeof(table[0])))
          int main(int argc, char **argv) {
            FILE *f = fopen(argv[1], "rb");
            if (!f) return 2;
            if (fread(img, 1, IMG_LEN, f) != IMG_LEN) return 3;
            fclose(f);
            FILE *vf = fopen(argv[2], "rb");
            FILE *of = fopen(argv[3], "wb");
            if (!vf || !of) return 4;
            uint32_t rec[18];
            static CPU c;
            while (fread(rec, 4, 18, vf) == 18) {
              fn_t fn = 0;
              for (int i = 0; i < NTABLE; i++) if (table[i].addr == rec[0]) { fn = table[i].fn; break; }
              for (uint32_t i = 0; i < SCR_LEN; i++) {
                uint32_t x = i * 2654435761u + rec[17];
                x ^= x >> 15; x *= 2246822519u; x ^= x >> 13;
                scr[i] = (uint8_t)x;
              }
              memset(&c, 0, sizeof c);
              for (int i = 0; i < 15; i++) c.r[i] = rec[1 + i];
              c.N = (rec[16] >> 3) & 1; c.Z = (rec[16] >> 2) & 1; c.C = (rec[16] >> 1) & 1; c.V = rec[16] & 1;
              g_unal = 0; g_steps = 0; g_depth = 0;
              volatile uint32_t status;
              if (!fn) status = 4;
              else if (setjmp(jb) == 0) {
                fn(&c);
                status = (uint32_t)c.status;
                if (status == 0 && c.r[15] != RET_ADDR) status = 2;
              } else status = 3;
              uint32_t out[20];
              memset(out, 0, sizeof out);
              out[0] = status; out[1] = (uint32_t)g_unal;
              for (int i = 0; i < 16; i++) out[2 + i] = c.r[i];
              out[18] = (c.N << 3) | (c.Z << 2) | (c.C << 1) | c.V;
              fwrite(out, 4, 20, of);
              uint64_t s1 = 0, s2 = 0;
              for (uint32_t i = 0; i < SCR_LEN; i++) { s1 += scr[i]; s2 += (uint64_t)scr[i] * (i + 1); }
              fwrite(&s1, 8, 1, of); fwrite(&s2, 8, 1, of);
            }
            fclose(of);
            return 0;
          }
          '''

          def emit(name, lines):
              return ('static void %s(CPU *c) {\n'
                      ' if (g_depth >= DEPTH_MAX) { c->status = 1; return; }\n'
                      ' g_depth++;\n'
                      ' uint32_t r[16]; memcpy(r, c->r, sizeof r);\n'
                      ' uint32_t N = c->N, Z = c->Z, C = c->C, V = c->V;\n'
                      '%s\n'
                      ' c->status = 2; goto done;\n'
                      ' done: ;\n'
                      ' memcpy(c->r, r, sizeof r); c->N = N; c->Z = Z; c->C = C; c->V = V;\n'
                      ' g_depth--;\n}\n') % (name, '\n'.join(lines))

          parts = [RT]
          for e in sorted(genset):
              parts.append('static void f_%08x(CPU *c);' % e)
          for e in sorted(genset):
              parts.append(emit('f_%08x' % e, info[e]['lines']))
          if canary is not None:
              bad_lines = [l.replace(MARK, BAD) for l in info[canary]['lines']]
              parts.append(emit('f_%08x_bad' % canary, bad_lines))
          parts.append('static ent_t table[] = {\n')
          for e in selected:
              parts.append(' { 0x%08xu, f_%08x },\n' % (e, e))
          if canary is not None:
              parts.append(' { 0x%08xu, f_%08x_bad },\n' % (0xE0000000 | canary, canary))
          parts.append('};\n')
          parts.append(MAIN)
          open('gen.c', 'w').write('\n'.join(parts))
          print('generated C: %d functions, %d bytes' % (len(genset), os.path.getsize('gen.c')))
          sys.stdout.flush()

          t1 = time.time()
          cp = subprocess.run(['gcc', '-O1', '-w', '-o', 'harness', 'gen.c'], capture_output=True, text=True)
          if cp.returncode != 0:
              print('COMPILE FAILED')
              print(cp.stderr[:4000])
              sys.exit(1)
          print('compiled in %.0fs' % (time.time() - t1))
          sys.stdout.flush()

          # ---------- test vectors ----------
          def rand_val(rng):
              x = rng.random()
              if x < 0.12:
                  return rng.choice([0, 1, 2, 3, 0xFFFFFFFF, 0x80000000, 0x7FFFFFFF])
              if x < 0.25:
                  return rng.randint(-8, 64) & 0xFFFFFFFF
              if x < 0.35:
                  return rng.getrandbits(32)
              if x < 0.80:
                  return SCR_BASE + 0x100 + 4 * rng.randrange(0, 0xC00 // 4)
              return TEXT_LO + 4 * rng.randrange(0, (CODE_LEN // 4) - 256)

          trials = []
          vec = bytearray()

          def add_trials(ckey, ukey, base_seed):
              for t in range(TRIALS):
                  rng = random.Random(base_seed * 7919 + t)
                  regs = [rand_val(rng) for _ in range(13)] + [SP_INIT, RET_ADDR]
                  flags = rng.randrange(16)
                  seed = rng.getrandbits(32)
                  trials.append((ckey, ukey, regs, flags, seed))
                  vec.extend(struct.pack('<I15III', ckey, *regs, flags, seed))

          for e in selected:
              add_trials(e, e, e)
          if canary is not None:
              add_trials(0xE0000000 | canary, canary, canary)
          open('vectors.bin', 'wb').write(vec)
          subprocess.run(['./harness', 'code.bin', 'vectors.bin', 'results.bin'], check=True, timeout=3000)
          res = list(struct.iter_unpack('<20IQQ', open('results.bin', 'rb').read()))
          assert len(res) == len(trials), (len(res), len(trials))
          print('C harness done, %d trials' % len(res))
          sys.stdout.flush()

          # ---------- Unicorn reference ----------
          mu = Uc(UC_ARCH_ARM, UC_MODE_ARM)
          cpu_note = 'arm1176'
          try:
              mu.ctl_set_cpu_model(A.UC_CPU_ARM_1176)
          except Exception as ex:
              cpu_note = 'default model (could not select arm1176: %s)' % ex
          mu.mem_map(TEXT_LO, CODE_LEN, UC_PROT_READ | UC_PROT_EXEC)
          mu.mem_write(TEXT_LO, code)
          mu.mem_map(SCR_BASE, SCR_SIZE, UC_PROT_ALL)
          RR = [getattr(A, 'UC_ARM_REG_R%d' % i) for i in range(13)]
          IDX = np.arange(SCR_SIZE, dtype=np.uint32)
          WTS = np.arange(1, SCR_SIZE + 1, dtype=np.uint64)

          def scratch(seed):
              x = IDX * np.uint32(2654435761) + np.uint32(seed)
              x = x ^ (x >> np.uint32(15))
              x = x * np.uint32(2246822519)
              x = x ^ (x >> np.uint32(13))
              return (x & np.uint32(255)).astype(np.uint8).tobytes()

          def run_uc(entry, regs, flags, seed):
              mu.mem_write(SCR_BASE, scratch(seed))
              for i in range(13):
                  mu.reg_write(RR[i], regs[i])
              mu.reg_write(A.UC_ARM_REG_SP, regs[13])
              mu.reg_write(A.UC_ARM_REG_LR, regs[14])
              mu.reg_write(A.UC_ARM_REG_CPSR, 0x10 | (flags << 28))
              status = 0
              try:
                  mu.emu_start(entry, RET_ADDR, count=2000000)
              except UcError:
                  status = 3
              else:
                  if mu.reg_read(A.UC_ARM_REG_PC) != RET_ADDR:
                      status = 1
              out = [mu.reg_read(RR[i]) for i in range(13)]
              out.append(mu.reg_read(A.UC_ARM_REG_SP))
              out.append(mu.reg_read(A.UC_ARM_REG_LR))
              fl = (mu.reg_read(A.UC_ARM_REG_CPSR) >> 28) & 15
              b = np.frombuffer(bytes(mu.mem_read(SCR_BASE, SCR_SIZE)), dtype=np.uint8).astype(np.uint64)
              return status, out, fl, int(b.sum()), int((b * WTS).sum())

          per = collections.defaultdict(lambda: collections.Counter())
          first_diff = {}
          skips = collections.Counter()
          both_fault = 0
          compared = matched = mismatched = 0
          can_cmp = can_mis = 0
          for idx, (ckey, ukey, regs, flags, seed) in enumerate(trials):
              rec = res[idx]
              is_can = (ckey != ukey)
              cstat, unal = rec[0], rec[1]
              if unal:
                  if not is_can:
                      skips['unaligned access'] += 1
                      per[ukey]['skip'] += 1
                  continue
              if cstat in (1, 2, 4):
                  if not is_can:
                      skips['C side: ' + {1: 'step or depth limit', 2: 'bad return', 4: 'function missing'}[cstat]] += 1
                      per[ukey]['skip'] += 1
                  continue
              ust, uregs, ufl, us1, us2 = run_uc(ukey, regs, flags, seed)
              if ust == 1:
                  if not is_can:
                      skips['unicorn instruction limit'] += 1
                      per[ukey]['skip'] += 1
                  continue
              if cstat == 3 and ust == 3:
                  if not is_can:
                      both_fault += 1
                      per[ukey]['fault'] += 1
                  continue
              diffs = []
              if cstat != ust:
                  diffs.append('fault disagreement: C=%s unicorn=%s' % ('fault' if cstat == 3 else 'ok', 'fault' if ust == 3 else 'ok'))
              else:
                  names = ['r%d' % i for i in range(13)] + ['sp', 'lr']
                  for i in range(15):
                      if rec[2 + i] != uregs[i]:
                          diffs.append('%s: C=0x%08x unicorn=0x%08x' % (names[i], rec[2 + i], uregs[i]))
                  if rec[18] != ufl:
                      diffs.append('flags NZCV: C=%s unicorn=%s' % (format(rec[18], '04b'), format(ufl, '04b')))
                  if rec[20] != us1 or rec[21] != us2:
                      diffs.append('scratch memory differs')
              if is_can:
                  can_cmp += 1
                  if diffs:
                      can_mis += 1
                  continue
              compared += 1
              if diffs:
                  mismatched += 1
                  per[ukey]['mismatch'] += 1
                  if ukey not in first_diff:
                      first_diff[ukey] = (diffs[:8], regs, flags)
              else:
                  matched += 1
                  per[ukey]['match'] += 1

          passed = failed = inconclusive = 0
          call_pass = call_fail = call_inc = 0
          failing = []
          for e in selected:
              c = per[e]
              if c['mismatch']:
                  failed += 1
                  failing.append(e)
                  if e in call_set:
                      call_fail += 1
              elif c['match'] >= 3:
                  passed += 1
                  if e in call_set:
                      call_pass += 1
              else:
                  inconclusive += 1
                  if e in call_set:
                      call_inc += 1

          out = []

          def p(s=''):
              out.append(s)

          p('Unicorn CPU: %s' % cpu_note)
          p('=== coverage (single-range ARM functions) ===')
          p('functions in export: %d (thumb %d, multi-range %d, single-range ARM %d)' % (total_funcs, n_thumb, n_multi, n_single))
          p('all instructions supported (calls allowed): %d' % locally_ok)
          p('translatable once every callee is translatable too: %d' % len(ok))
          p('instructions supported: %d of %d (%.1f%%) (literal-pool words excluded)' % (instr_ok, instr_total, 100.0 * instr_ok / max(instr_total, 1)))
          p('=== test run ===')
          p('functions tested: %d (%d with calls), generated C for %d functions' % (len(selected), len(call_set), len(genset)))
          p('trials: %d' % (len(trials)))
          p('compared: %d, matched: %d, MISMATCHED: %d, both faulted: %d' % (compared, matched, mismatched, both_fault))
          for k, v in skips.most_common():
              p('skipped (%s): %d' % (k, v))
          p('functions: PASS %d, FAIL %d, inconclusive (fewer than 3 comparable trials) %d' % (passed, failed, inconclusive))
          p('  of those with calls: PASS %d, FAIL %d, inconclusive %d' % (call_pass, call_fail, call_inc))
          if canary is None:
              p('canary: no function with a plain add was available, so the test could not be validated')
          else:
              p('canary (deliberately wrong copy of 0x%08x): caught in %d of %d comparable trials' % (canary, can_mis, can_cmp))
              if can_cmp == 0:
                  p('  WARNING: no comparable trial for the canary, so the test is not validated')
              elif can_mis == 0:
                  p('  WARNING: the planted bug was NOT caught, so a clean result above proves little')
          p('=== why single-range functions are not translatable yet (first blocker per function) ===')
          for k, v in func_blockers.most_common(30):
              p('  %d  %s' % (v, k))
          p('=== unsupported instructions, counted per instruction ===')
          for k, v in instr_blockers.most_common(40):
              p('  %d  %s' % (v, k))
          p('=== callees that block the most functions ===')
          for d, cnt in dependents.most_common(25):
              rs_ = info[d]['reasons']
              p('  0x%08x size=%d blocks %d callers; %s' % (
                  d, meta[d][1] - meta[d][0], cnt,
                  rs_[0] if rs_ else 'it depends on another untranslatable function'))
          p('=== first mismatch for up to 15 failing functions ===')
          for e in failing[:15]:
              d, regs, fl = first_diff[e]
              p('function 0x%08x: %s' % (e, '; '.join(d)))
              p('   inputs r0-r3: %s flags NZCV=%s' % (' '.join('%08x' % x for x in regs[:4]), format(fl, '04b')))
          open('reports/translate_summary.txt', 'w').write('\n'.join(out) + '\n')

          with open('reports/mismatch_excerpts.txt', 'w') as w:
              w.write('Short disassembly excerpts of up to 3 failing functions (derived from the game; keep private)\n')
              for e in failing[:3]:
                  lo, hix = meta[e]
                  w.write('\n== 0x%08x ==\n' % e)
                  shown = 0
                  for i in range((hix - lo) // 4):
                      a = lo + 4 * i
                      word = struct.unpack_from('<I', code, a - TEXT_LO)[0]
                      for ins in md.disasm(struct.pack('<I', word), a):
                          w.write('%08x  %08x  %s %s\n' % (a, word, ins.mnemonic, ins.op_str))
                      shown += 1
                      if shown >= 25:
                          break
          print('done in %.0fs' % (time.time() - t0))
          PY

      - name: Run translator and tests
        env:
          TRIALS: ${{ inputs.trials }}
          MAXF: ${{ inputs.max_functions }}
        run: python3 tr.py

      - name: Show reports
        if: always()
        run: |
          echo "=== translate_summary ==="
          cat reports/translate_summary.txt || true
          echo "=== mismatch excerpts (first 80 lines) ==="
          head -80 reports/mismatch_excerpts.txt || true

      - name: Remove translated code from the runner
        if: always()
        run: rm -f gen.c harness code.bin vectors.bin results.bin

      - name: Upload reports (text only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albw-translate2
          path: reports/*
          retention-days: 7

