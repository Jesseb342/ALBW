name: Ghidra ALBW coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Ghidra project cache
        uses: actions/cache/restore@v4
        with:
          path: ghproj
          key: ghproj-albw-v2-none
          restore-keys: |
            ghproj-albw-v2-
            ghproj-albw-v1
          fail-on-cache-miss: true

      - name: Download Ghidra (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl tools
          gh release download --repo NationalSecurityAgency/ghidra \
            --pattern 'ghidra_*_PUBLIC_*.zip' --dir dl
          unzip -q dl/*.zip -d tools

      - name: Write coverage script
        run: |
          mkdir -p ghidra_scripts reports
          cat > ghidra_scripts/Coverage.java <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.mem.*;
          import java.io.*;
          import java.util.*;
          import java.util.regex.*;

          public class Coverage extends GhidraScript {
            static final long TEXT_LO = 0x100000L;
            static final long TEXT_HI = 0x69211cL;
            static final Pattern CMP = Pattern.compile("^cmp\\w*\\s+(\\w+),#(0x[0-9a-f]+|\\d+)$");
            static final Pattern VENEER = Pattern.compile("^ldr\\w*\\s+pc,\\[pc,#(-?0x[0-9a-f]+|-?\\d+)\\].*");
            static final Pattern SWITCH = Pattern.compile("^ldr\\w*\\s+pc,\\[pc,\\s*[-+]?r\\d+.*");
            static final Pattern ADDPC = Pattern.compile("^add\\w*\\s+pc,pc,.*");
            Memory mem;
            Listing listing;
            FunctionManager fm;

            static String hex8(long v) { return String.format("0x%08x", v); }
            static boolean inText(long v) { return v >= TEXT_LO && v < TEXT_HI; }

            static long num(String s) {
              boolean neg = s.startsWith("-");
              if (neg) s = s.substring(1);
              long v = s.startsWith("0x") ? Long.parseLong(s.substring(2), 16) : Long.parseLong(s);
              return neg ? -v : v;
            }

            Long word(long addr) {
              try {
                return Long.valueOf(mem.getInt(toAddr(addr), false) & 0xFFFFFFFFL);
              } catch (Exception e) {
                return null;
              }
            }

            @Override
            public void run() throws Exception {
              mem = currentProgram.getMemory();
              listing = currentProgram.getListing();
              fm = currentProgram.getFunctionManager();
              String dir = System.getenv("REPORT_DIR");
              if (dir == null) dir = "reports";
              new File(dir).mkdirs();
              PrintWriter sum = new PrintWriter(new FileWriter(dir + "/coverage_summary.txt"));

              sum.println("functions: " + fm.getFunctionCount());

              // ---------- PART 1: undefined ranges inside .text ----------
              MemoryBlock text = mem.getBlock(".text");
              AddressSet textSet = new AddressSet(text.getStart(), text.getEnd());
              AddressSetView undef = listing.getUndefinedRanges(textSet, true, monitor);
              Map<String, long[]> byClass = new TreeMap<>();
              List<long[]> codeLike = new ArrayList<>();
              PrintWriter uw = new PrintWriter(new FileWriter(dir + "/undefined_ranges.txt"));
              long undefTotal = 0;
              int nRanges = 0;
              int lines = 0;
              for (AddressRange r : undef) {
                long start = r.getMinAddress().getOffset();
                long len = r.getLength();
                undefTotal += len;
                nRanges++;
                String cls = "unreadable";
                try {
                  int n = (int) Math.min(len, 1L << 20);
                  byte[] buf = new byte[n];
                  mem.getBytes(r.getMinAddress(), buf);
                  int zeros = 0;
                  for (int i = 0; i < n; i++) if (buf[i] == 0) zeros++;
                  if (zeros == n) {
                    cls = "zero-pad";
                  } else {
                    int skip = (int) ((4 - (start & 3)) & 3);
                    int total = 0, cond = 0, ptr = 0;
                    for (int i = skip; i + 4 <= n; i += 4) {
                      long w = (buf[i] & 0xFFL) | ((buf[i + 1] & 0xFFL) << 8)
                        | ((buf[i + 2] & 0xFFL) << 16) | ((buf[i + 3] & 0xFFL) << 24);
                      total++;
                      if ((w >>> 28) == 0xEL) cond++;
                      if (inText(w & ~1L)) ptr++;
                    }
                    if (total > 0 && ptr * 2 >= total) cls = "pointer-like";
                    else if (total > 0 && cond * 10 >= total * 6) cls = "code-like";
                    else cls = "other";
                  }
                } catch (Exception e) { }
                long[] c = byClass.computeIfAbsent(cls, k -> new long[2]);
                c[0]++;
                c[1] += len;
                if (cls.equals("code-like")) codeLike.add(new long[] {start, len});
                if (lines < 20000) {
                  uw.println(hex8(start) + " " + len + " " + cls);
                  lines++;
                }
              }
              uw.close();
              sum.println("=== undefined ranges in .text ===");
              sum.println("ranges: " + nRanges + ", bytes: " + undefTotal);
              for (Map.Entry<String, long[]> e : byClass.entrySet()) {
                sum.println("  " + e.getKey() + ": " + e.getValue()[0] + " ranges, " + e.getValue()[1] + " bytes");
              }
              codeLike.sort((a, b) -> Long.compare(b[1], a[1]));
              sum.println("largest code-like ranges:");
              for (int i = 0; i < Math.min(25, codeLike.size()); i++) {
                sum.println("  " + hex8(codeLike.get(i)[0]) + " size " + codeLike.get(i)[1]);
              }

              // ---------- PART 2: pointers into code from data ----------
              long ptrTotal = 0, known = 0, mid = 0, undefT = 0, thumbPtr = 0;
              TreeSet<Long> undefTargets = new TreeSet<>();
              PrintWriter pw = new PrintWriter(new FileWriter(dir + "/code_pointers.txt"));
              int pl = 0;
              for (String bn : new String[] {".rodata", ".data"}) {
                MemoryBlock b = mem.getBlock(bn);
                if (b == null) continue;
                long s = b.getStart().getOffset();
                long e = b.getEnd().getOffset();
                for (long a = s; a + 3 <= e; a += 4) {
                  Long w = word(a);
                  if (w == null) continue;
                  long v = w.longValue();
                  long t = v & ~1L;
                  if (!inText(t)) continue;
                  boolean thumb = (v & 1L) != 0;
                  if (!thumb && (v & 3L) != 0) continue;
                  ptrTotal++;
                  if (thumb) thumbPtr++;
                  Address ta = toAddr(t);
                  if (fm.getFunctionAt(ta) != null) {
                    known++;
                    continue;
                  }
                  String kind;
                  if (listing.getInstructionAt(ta) != null) {
                    mid++;
                    Function cf = fm.getFunctionContaining(ta);
                    kind = "inside-code in " + (cf == null ? "-" : cf.getName());
                  } else {
                    undefT++;
                    undefTargets.add(Long.valueOf(t));
                    kind = "NOT-CODE";
                  }
                  if (pl < 8000) {
                    pw.println(hex8(a) + " -> " + hex8(v) + (thumb ? " T " : " A ") + kind);
                    pl++;
                  }
                }
              }
              pw.close();
              sum.println("=== pointers from .rodata/.data into .text ===");
              sum.println("total: " + ptrTotal + " (thumb-style: " + thumbPtr + ")");
              sum.println("point at a known function: " + known);
              sum.println("point inside a function (not at entry): " + mid);
              sum.println("point at undefined bytes (missed code?): " + undefT
                + " (" + undefTargets.size() + " distinct targets)");
              int shown = 0;
              for (Long t : undefTargets) {
                if (shown++ >= 25) break;
                sum.println("  " + hex8(t.longValue()));
              }

              // ---------- PART 3: jump tables and veneers ----------
              PrintWriter jw = new PrintWriter(new FileWriter(dir + "/jumptables.txt"));
              int nSwitch = 0, nVeneer = 0, nAdd = 0, withBound = 0, shortN = 0, noBound = 0;
              int stCode = 0, stData = 0, stUndef = 0, maxEntries = 0;
              long totalEntries = 0;
              TreeSet<Long> veneerTargets = new TreeSet<>();
              int veneerUnres = 0;
              InstructionIterator it = listing.getInstructions(true);
              while (it.hasNext()) {
                Instruction x = it.next();
                String t = x.toString().toLowerCase().trim();
                long a = x.getAddress().getOffset();
                Matcher m;
                if (SWITCH.matcher(t).matches()) {
                  nSwitch++;
                  long bound = -1;
                  Instruction p = x.getPrevious();
                  for (int i = 0; i < 4 && p != null; i++) {
                    Matcher cm = CMP.matcher(p.toString().toLowerCase().trim());
                    if (cm.matches()) {
                      bound = num(cm.group(2));
                      break;
                    }
                    p = p.getPrevious();
                  }
                  long tbl = a + 8;
                  int max = bound >= 0 ? (int) Math.min(bound, 512) : 300;
                  int entries = 0;
                  List<String> first = new ArrayList<>();
                  for (int i = 0; i < max; i++) {
                    Long w = word(tbl + 4L * i);
                    if (w == null || !inText(w.longValue() & ~1L)) break;
                    entries++;
                    if (first.size() < 3) first.add(hex8(w.longValue()));
                  }
                  String status;
                  Address tbla = toAddr(tbl);
                  if (listing.getInstructionAt(tbla) != null) {
                    status = "decoded-as-code";
                    stCode++;
                  } else if (listing.getDefinedDataAt(tbla) != null) {
                    status = "data";
                    stData++;
                  } else {
                    status = "undefined";
                    stUndef++;
                  }
                  if (bound >= 0) {
                    withBound++;
                    if (entries < bound) shortN++;
                  } else {
                    noBound++;
                  }
                  totalEntries += entries;
                  if (entries > maxEntries) maxEntries = entries;
                  jw.println(hex8(a) + " switch bound=" + bound + " entries=" + entries
                    + " table=" + hex8(tbl) + " " + status + " first=" + first + " | " + t);
                } else if ((m = VENEER.matcher(t)).matches()) {
                  nVeneer++;
                  long imm = num(m.group(1));
                  Long w = word(a + 8 + imm);
                  if (w != null) veneerTargets.add(w); else veneerUnres++;
                  jw.println(hex8(a) + " veneer target=" + (w == null ? "?" : hex8(w.longValue())) + " | " + t);
                } else if (ADDPC.matcher(t).matches()) {
                  nAdd++;
                  jw.println(hex8(a) + " add-pc | " + t);
                }
              }
              jw.close();
              sum.println("=== jump tables ===");
              sum.println("switch-style (ldr pc,[pc,reg..]): " + nSwitch);
              sum.println("  with a cmp bound found: " + withBound + ", entries shorter than bound: " + shortN
                + ", no bound found: " + noBound);
              sum.println("  total entries: " + totalEntries + ", largest table: " + maxEntries);
              sum.println("  table region currently: decoded-as-code " + stCode + ", data " + stData + ", undefined " + stUndef);
              sum.println("veneers (ldr pc,[pc,#imm]): " + nVeneer
                + ", distinct targets: " + veneerTargets.size() + ", unresolved: " + veneerUnres);
              sum.println("add pc,pc,reg: " + nAdd);
              sum.close();
            }
          }
          JAVA

      - name: Run coverage
        run: |
          set -euo pipefail
          GH="$(find tools -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          export REPORT_DIR="$PWD/reports"
          "$GH/support/analyzeHeadless" "$PWD/ghproj" ALBW \
            -process baserom.elf \
            -noanalysis \
            -readOnly \
            -scriptPath "$PWD/ghidra_scripts" \
            -postScript Coverage.java

      - name: Show reports
        run: |
          echo "=== coverage_summary ==="
          cat reports/coverage_summary.txt
          echo "=== jumptables (first 25) ==="
          head -25 reports/jumptables.txt
          echo "=== code_pointers (first 30) ==="
          head -30 reports/code_pointers.txt

      - name: Upload reports (text only)
        uses: actions/upload-artifact@v4
        with:
          name: albw-coverage
          path: reports/*.txt
          retention-days: 1

