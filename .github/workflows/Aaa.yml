name: Ghidra ALBW seed pass 2

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: "Exact v2 project cache key (e.g. ghproj-albw-v2-38100867527)"
        required: true
        default: "paste-the-full-v2-key-here"

jobs:
  seed2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Ghidra project cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ghproj
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Cache status
        run: |
          echo "Requested key: ${{ inputs.cache_key }}"
          echo "Restored key:  ${{ steps.cache.outputs.cache-matched-key }}"
          du -sh ghproj

      - name: Download Ghidra (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl tools
          gh release download --repo NationalSecurityAgency/ghidra \
            --pattern 'ghidra_*_PUBLIC_*.zip' --dir dl
          unzip -q dl/*.zip -d tools

      - name: Write seed script
        run: |
          mkdir -p ghidra_scripts reports
          cat > ghidra_scripts/Seed2.java <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.mem.*;
          import ghidra.program.model.symbol.*;
          import java.io.*;
          import java.util.*;
          import java.util.regex.*;

          public class Seed2 extends GhidraScript {
            static final long TEXT_LO = 0x100000L;
            static final long TEXT_HI = 0x69211cL;
            static final Pattern CMP = Pattern.compile("^cmp\\w*\\s+(\\w+),#(0x[0-9a-f]+|\\d+)$");
            static final Pattern SWITCH = Pattern.compile("^ldr\\w*\\s+pc,\\[pc,\\s*[-+]?r\\d+.*");
            Memory mem;
            Listing listing;
            FunctionManager fm;

            static String hex8(long v) { return String.format("0x%08x", v); }
            static boolean inText(long v) { return v >= TEXT_LO && v < TEXT_HI; }

            static long num(String s) {
              boolean neg = s.startsWith("-");
              if (neg) s = s.substring(1);
              long v = s.startsWith("0x") ? Long.parseLong(s.substring(2), 16) : Long.parseLong(s);
              return neg ? -v : v;
            }

            Long word(long addr) {
              try {
                return Long.valueOf(mem.getInt(toAddr(addr), false) & 0xFFFFFFFFL);
              } catch (Exception e) {
                return null;
              }
            }

            boolean undefinedAt(long o) {
              Address a = toAddr(o);
              return listing.getInstructionContaining(a) == null
                && listing.getDefinedDataContaining(a) == null;
            }

            long undefinedBytes() throws Exception {
              MemoryBlock text = mem.getBlock(".text");
              AddressSet ts = new AddressSet(text.getStart(), text.getEnd());
              long total = 0;
              for (AddressRange r : listing.getUndefinedRanges(ts, true, monitor)) total += r.getLength();
              return total;
            }

            long[] orphans() {
              long n = 0, bytes = 0;
              InstructionIterator it = listing.getInstructions(true);
              while (it.hasNext()) {
                Instruction x = it.next();
                if (fm.getFunctionContaining(x.getAddress()) == null) {
                  n++;
                  bytes += x.getLength();
                }
              }
              return new long[] {n, bytes};
            }

            @Override
            public void run() throws Exception {
              mem = currentProgram.getMemory();
              listing = currentProgram.getListing();
              fm = currentProgram.getFunctionManager();
              ReferenceManager rm = currentProgram.getReferenceManager();
              String dir = System.getenv("REPORT_DIR");
              if (dir == null) dir = "reports";
              new File(dir).mkdirs();
              PrintWriter sum = new PrintWriter(new FileWriter(dir + "/seed2_summary.txt"));
              PrintWriter fail = new PrintWriter(new FileWriter(dir + "/seed2_failures.txt"));

              long[] o0 = orphans();
              sum.println("start: functions=" + fm.getFunctionCount()
                + " undefined bytes=" + undefinedBytes()
                + " instructions outside any function=" + o0[0] + " (" + o0[1] + " bytes)");
              sum.flush();

              for (int pass = 1; pass <= 3; pass++) {
                TreeSet<Long> callT = new TreeSet<>();
                TreeSet<Long> jumpT = new TreeSet<>();
                TreeSet<Long> tableT = new TreeSet<>();
                List<long[]> refs = new ArrayList<>();
                int switches = 0;

                InstructionIterator it = listing.getInstructions(true);
                while (it.hasNext()) {
                  Instruction x = it.next();
                  FlowType ft = x.getFlowType();
                  if (!ft.isComputed() && (ft.isCall() || ft.isJump())) {
                    for (Address t : x.getFlows()) {
                      long o = t.getOffset();
                      if (!inText(o)) continue;
                      if (!undefinedAt(o)) continue;
                      if (ft.isCall()) callT.add(Long.valueOf(o)); else jumpT.add(Long.valueOf(o));
                    }
                  }
                  String t = x.toString().toLowerCase().trim();
                  if (SWITCH.matcher(t).matches()) {
                    switches++;
                    long a = x.getAddress().getOffset();
                    long bound = -1;
                    Instruction p = x.getPrevious();
                    for (int i = 0; i < 4 && p != null; i++) {
                      Matcher cm = CMP.matcher(p.toString().toLowerCase().trim());
                      if (cm.matches()) {
                        bound = num(cm.group(2));
                        break;
                      }
                      p = p.getPrevious();
                    }
                    long tbl = a + 8;
                    int max = bound >= 0 ? (int) Math.min(bound, 512) : 300;
                    for (int i = 0; i < max; i++) {
                      Long w = word(tbl + 4L * i);
                      if (w == null) break;
                      long target = w.longValue() & ~1L;
                      if (!inText(target)) break;
                      if (bound < 0 && Math.abs(target - a) > 0x8000L) break;
                      if (pass == 1) refs.add(new long[] {a, target});
                      if (undefinedAt(target)) tableT.add(Long.valueOf(target));
                    }
                  }
                }

                int refsAdded = 0;
                for (long[] r : refs) {
                  try {
                    rm.addMemoryReference(toAddr(r[0]), toAddr(r[1]), RefType.COMPUTED_JUMP,
                      SourceType.USER_DEFINED, Reference.MNEMONIC);
                    refsAdded++;
                  } catch (Exception e) { }
                }

                int fCreated = 0, dCreated = 0, failed = 0;
                for (Long lo : callT) {
                  long o = lo.longValue();
                  if (!undefinedAt(o)) continue;
                  Address a = toAddr(o);
                  boolean ok = false;
                  try {
                    if (disassemble(a)) {
                      Function f = createFunction(a, null);
                      if (f != null) { fCreated++; ok = true; }
                    }
                  } catch (Exception e) { }
                  if (!ok) { failed++; if (failed <= 200) fail.println("pass " + pass + " call " + hex8(o)); }
                }
                for (Long lo : jumpT) {
                  long o = lo.longValue();
                  if (!undefinedAt(o)) continue;
                  boolean ok = false;
                  try { ok = disassemble(toAddr(o)); } catch (Exception e) { }
                  if (ok) dCreated++;
                  else { failed++; if (failed <= 200) fail.println("pass " + pass + " jump " + hex8(o)); }
                }
                for (Long lo : tableT) {
                  long o = lo.longValue();
                  if (!undefinedAt(o)) continue;
                  boolean ok = false;
                  try { ok = disassemble(toAddr(o)); } catch (Exception e) { }
                  if (ok) dCreated++;
                  else { failed++; if (failed <= 200) fail.println("pass " + pass + " table " + hex8(o)); }
                }

                sum.println("pass " + pass + ": switches=" + switches + " refs added=" + refsAdded
                  + " | call targets=" + callT.size() + " jump targets=" + jumpT.size()
                  + " table targets=" + tableT.size()
                  + " | functions created=" + fCreated + " code disassembled=" + dCreated
                  + " failed=" + failed);
                sum.flush();
                if (fCreated + dCreated == 0) break;
                analyzeChanges(currentProgram);
                long[] o1 = orphans();
                sum.println("  after analysis: functions=" + fm.getFunctionCount()
                  + " undefined bytes=" + undefinedBytes()
                  + " instructions outside any function=" + o1[0]);
                sum.flush();
              }

              long[] o2 = orphans();
              sum.println("final: functions=" + fm.getFunctionCount()
                + " undefined bytes=" + undefinedBytes()
                + " instructions outside any function=" + o2[0] + " (" + o2[1] + " bytes)");
              sum.close();
              fail.close();
            }
          }
          JAVA

      - name: Run seeding (modifies the project)
        run: |
          set -euo pipefail
          GH="$(find tools -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          export REPORT_DIR="$PWD/reports"
          "$GH/support/analyzeHeadless" "$PWD/ghproj" ALBW \
            -process baserom.elf \
            -noanalysis \
            -scriptPath "$PWD/ghidra_scripts" \
            -postScript Seed2.java

      - name: Show reports
        run: |
          echo "=== seed2_summary ==="
          cat reports/seed2_summary.txt
          echo "=== first 30 failures ==="
          head -30 reports/seed2_failures.txt
          echo "New project cache key: ghproj-albw-v3-${{ github.run_id }}"

      - name: Save improved project to cache
        uses: actions/cache/save@v4
        with:
          path: ghproj
          key: ghproj-albw-v3-${{ github.run_id }}

      - name: Upload reports (text only)
        uses: actions/upload-artifact@v4
        with:
          name: albw-seed2
          path: reports/*.txt
          retention-days: 7

